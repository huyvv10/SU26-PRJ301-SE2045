<html>
    <head>
        <title>Exchange Currency</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
    <center><div><h2>Exchange Currency</h2></div></center><!-- comment -->
    <form action="exchangecurrency" method="Post">
        <table>
            <tr>
                <td>Amount</td>
                <td><input type="text" name="amount" placeholder="Money amouts" ></td>
                <td>
                    <select name="method">
                        <option value="buy">Buy</option>
                        <option value="sell" selected>Sell</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="radio" name="moneytype" value="usd" checked>USD<br>
                    <input type="radio" name="moneytype" value="eur">EUR
                </td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Calculate">
                    <input type="reset" value="Clear">
                </td>
                <td></td>
            </tr>
            
        </table>
    </form>
</body>
</html>
